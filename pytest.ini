[pytest]
# Put the project root on sys.path so tests can `import main`,
# `import database`, `import security`, etc.
#
# Without this, plain `pytest` fails to collect EVERY test file with
# "ModuleNotFoundError": by default pytest adds only the test file's own
# directory (tests/) to sys.path, not the project root where the modules
# live. (`python -m pytest` happens to work because it also adds the
# current directory -- which is exactly why this is easy to miss.)
# Needs pytest 7.0+; requirements-dev.txt pins 8.x.
pythonpath = .
testpaths = tests
